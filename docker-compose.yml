services:
  postgres:
    image: postgres:16-alpine
    container_name: api_blank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_blank
      POSTGRES_USER: api_blank
      POSTGRES_PASSWORD: api_blank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
