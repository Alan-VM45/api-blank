name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: 1 · Compilar el proyecto y las pruebas
        run: ./mvnw --batch-mode test-compile
      - name: 2 · Pruebas unitarias
        run: ./mvnw --batch-mode test
      - name: 3 · Pruebas de integración y cobertura
        run: ./mvnw --batch-mode verify
      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$8; c+=$9} END {if (m+c>0) printf "### Cobertura de líneas: %.1f%%\n", 100*c/(m+c)}' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-cobertura
          path: target/site/jacoco
