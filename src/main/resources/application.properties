spring.application.name=api-blank

server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_blank}
spring.datasource.username=${DB_USERNAME:api_blank}
spring.datasource.password=${DB_PASSWORD:api_blank}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secreto=${JWT_SECRETO:dev-secreto-local-solo-para-desarrollo-cambiar-en-produccion-1234567890}
app.jwt.vigencia-minutos=${JWT_VIGENCIA_MINUTOS:60}
